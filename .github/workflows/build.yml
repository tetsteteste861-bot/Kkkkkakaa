name: build

on:
  workflow_dispatch:
  push:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Coletar exemplo e API
        run: |
          mkdir out
          git clone --depth 1 https://github.com/arismoko/horizon-machine-sample sample || true
          git clone --depth 1 https://github.com/horizon-rust/horizon h || true
          {
            echo "=== sample/src/tour/client.rs"; cat sample/src/tour/client.rs
            echo "=== sample/src/lib.rs"; cat sample/src/lib.rs
            echo "=== sample/Cargo.toml"; cat sample/Cargo.toml
            echo "=== sample/horizon-mod.toml"; cat sample/horizon-mod.toml
            echo "=== API"
            grep -rn -B2 -A14 "input_key\|register_key_mapping\|NativeKeyRegistration\|fn mod_key" h/crates --include=*.rs | head -c 300000
          } > out/dump.txt 2>&1 || true
          wc -c out/dump.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: out/dump.txt
          
